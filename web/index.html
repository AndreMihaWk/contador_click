<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISITANTES</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="logo-governo">
                <img src="img/food.jpg" alt="Governo de Roraima">
            </div>

        </div>

        <div class="right-panel">
            <div id="acoesParado" class="acoes-parado" hidden>
                <button id="btnRelatorio" class="btn-acao">📊 Relatório</button>
                <button id="btnArea" class="btn-acao">✏️ Área da Câmera</button>
            </div>
            <button id="btnContagem" class="btn-contagem">▶ INICIAR CONTAGEM</button>

            <h1>VISITANTES</h1>
            <h2>VISITANTES DO DIA</h2>
            <div class="quantidade">[0]</div>
            <div class="total-label">TOTAL DE VISITANTES</div>
            <div class="total-numero" id="totalVisitantes">0</div>
            <div class="total-dias">em <span id="diasFuncionando">0</span> dia(s) de funcionamento</div>

            <img id="cameraAoVivo" class="camera-ao-vivo" alt="Câmera ao vivo" hidden>
            <div id="avisoCamera" class="aviso-camera" hidden></div>
            <div class="info-data">Data: <span id="dataAtual"></span></div>
        </div>
    </div>

    <script src="js/home.js"></script>
</body>
</html>
