<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Visitantes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 36px;
        }

        .resumo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .card h3 {
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .card .numero {
            font-size: 48px;
            font-weight: bold;
        }

        .tabela-container {
            overflow-x: auto;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }

        tbody tr:hover {
            background: #f5f5f5;
        }

        tfoot td {
            background: #eef0fd;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            border-bottom: none;
        }

        .status {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.fechado {
            background: #607d8b;
            color: white;
        }

        .status.ativo {
            background: #4caf50;
            color: white;
        }

        .baixar {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }

        .baixar:hover {
            text-decoration: underline;
        }

        .botoes {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-voltar {
            background: #4caf50;
            color: white;
        }

        .btn-voltar:hover {
            background: #45a049;
        }

        .btn-atualizar {
            background: #2196f3;
            color: white;
        }

        .btn-atualizar:hover {
            background: #0b7dda;
        }

        .btn-baixar {
            background: #607d8b;
            color: white;
        }

        .btn-baixar:hover {
            background: #455a64;
        }

        .sem-dados {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 18px;
        }

        .data-atual {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Relatório de Visitantes</h1>
        <div class="data-atual">Última atualização: <span id="dataAtualizacao"></span></div>

        <div class="resumo">
            <div class="card">
                <h3>VISITANTES HOJE</h3>
                <div class="numero" id="visitantesHoje">0</div>
            </div>
            <div class="card">
                <h3>TOTAL ACUMULADO</h3>
                <div class="numero" id="totalAcumulado">0</div>
            </div>
            <div class="card">
                <h3>DIAS EM FUNCIONAMENTO</h3>
                <div class="numero" id="diasFuncionando">0</div>
            </div>
        </div>

        <h2 style="margin-bottom: 20px; color: #333;">📅 Histórico Detalhado</h2>

        <div class="tabela-container">
            <table id="tabelaHistorico">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Visitantes do Dia</th>
                        <th>Status</th>
                        <th>Relatório</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr>
                        <td colspan="4" class="sem-dados">Carregando dados...</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td>TOTAL DE VISITANTES</td>
                        <td id="totalTabela" colspan="3">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="botoes">
            <button class="btn-voltar" onclick="window.location.href='/'">
                ← Voltar para o Telão
            </button>
            <button class="btn-atualizar" onclick="carregarDados()">
                🔄 Atualizar
            </button>
            <button class="btn-baixar" onclick="window.location.href='/api/relatorio/completo.csv'">
                ⬇ Baixar Relatório Completo
            </button>
        </div>
    </div>

    <script>
        async function carregarDados() {
            try {
                const [contagem, dias] = await Promise.all([
                    fetch('/api/contagem').then(resposta => resposta.json()),
                    fetch('/api/historico').then(resposta => resposta.json()),
                ]);

                document.getElementById('visitantesHoje').textContent = formatarNumero(contagem.hoje);
                document.getElementById('totalAcumulado').textContent = formatarNumero(contagem.acumulado);
                document.getElementById('diasFuncionando').textContent = contagem.dias;
                document.getElementById('totalTabela').textContent = formatarNumero(contagem.acumulado);
                document.getElementById('dataAtualizacao').textContent = new Date().toLocaleString('pt-BR');

                atualizarTabela(dias);
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                document.getElementById('corpoTabela').innerHTML =
                    '<tr><td colspan="4" class="sem-dados">Erro ao carregar dados</td></tr>';
            }
        }

        function atualizarTabela(dias) {
            const tbody = document.getElementById('corpoTabela');

            if (dias.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="sem-dados">Nenhum dado registrado ainda</td></tr>';
                return;
            }

            tbody.innerHTML = dias.map(dia => {
                const fechado = dia.relatorio_gerado_em !== null;
                return `
                    <tr>
                        <td><strong>${formatarData(dia.data)}</strong></td>
                        <td>${formatarNumero(dia.total)}</td>
                        <td><span class="status ${fechado ? 'fechado' : 'ativo'}">${fechado ? 'Fechado' : 'Em andamento'}</span></td>
                        <td><a class="baixar" href="/api/relatorio/${dia.data}.csv">⬇ Baixar CSV</a></td>
                    </tr>
                `;
            }).join('');
        }

        function formatarNumero(numero) {
            return numero.toLocaleString('pt-BR');
        }

        function formatarData(dataIso) {
            const [ano, mes, dia] = dataIso.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        // Carregar dados ao abrir a página
        window.addEventListener('load', carregarDados);

        // Atualizar automaticamente a cada 30 segundos
        setInterval(carregarDados, 30000);
    </script>
</body>
</html>
